name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: "3.12"

      # Same version as the one that generated poetry.lock
      - name: Install Poetry
        run: pipx install poetry==2.5.1

      - name: Use an in-project virtualenv
        run: poetry config virtualenvs.in-project true

      # llama-cpp-python is compiled from source and torch is large: caching
      # the whole virtualenv, keyed on the lock file, keeps CI fast
      - name: Cache the virtualenv
        uses: actions/cache@v5
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run tests
        run: poetry run pytest -q
