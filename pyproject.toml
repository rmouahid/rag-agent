[project]
name = "rag-agent"
version = "0.1.0"
description = "A minimal but precise Retrieval-Augmented Generation (RAG) agent built from scratch in Python"
authors = [{ name = "rmouahid" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<4.0"
# Dependencies stay in [tool.poetry.dependencies]: torch comes from the
# PyTorch CPU index, which only Poetry's source configuration can express
dynamic = ["dependencies"]

[project.scripts]
rag-agent = "rag_agent.cli:run"

[tool.poetry]
packages = [{ include = "rag_agent" }]

[tool.poetry.dependencies]
numpy = "^1.26.4"
torch = { version = "^2.14", source = "pytorch-cpu" }
sentence-transformers = "^3.4.1"
fastapi = "^0.115.14"
uvicorn = "^0.32.1"
pymupdf = "^1.28.2"
requests = "^2.34.2"
beautifulsoup4 = "^4.15.0"
python-dotenv = "^1.2.3"
llama-cpp-python = "^0.3.35"
python-multipart = "^0.0.20"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
httpx = "^0.27.2"
black = "^26.10.0"
ruff = "^0.16.10"
pre-commit = "^4.6.2"
mypy = "^2.4.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# pycodestyle errors, pyflakes, import sorting, pyupgrade, bugbear
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = [
    # FastAPI declares dependencies as default arguments (Depends, File, Form, Query)
    "B008",
    # zip(strict=True) would change behaviour; lengths are checked where it matters
    "B905",
]

[tool.mypy]
python_version = "3.11"
files = ["rag_agent"]
# Every function of the package is annotated, and their bodies are checked
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
